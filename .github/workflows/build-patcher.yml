name: Build Patcher Package

# 패처 코드(patcher/)가 바뀔 때만 수동으로 실행!
# 번역 데이터만 올릴 때는 실행하지 않음.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-patcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      # PyInstaller 미사용: python.org 서명본 런타임 + 패처 소스(.py) 그대로
      - name: Build package
        id: build
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python patcher/build_package.py --out dist
          $zip = Get-ChildItem dist -Filter "LastEpoch_KR_Patcher-v*.zip"
          "name=$($zip.BaseName)" >> $env:GITHUB_OUTPUT

      - name: Smoke test
        run: dist\LastEpoch_KR_Patcher\runtime\python.exe -B -c "import patcher, tkinter, ssl; print(patcher.PATCHER_VERSION)"

      # 이 zip들이 이 저장소의 이 커밋에서 빌드됐다는 증명 (gh attestation verify로 확인)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/LastEpoch_KR_Patcher-*.zip

      # 전체 패키지, 자체 업데이트용 app zip, SHA256SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/LastEpoch_KR_Patcher-*.zip
            dist/SHA256SUMS
          compression-level: 0
